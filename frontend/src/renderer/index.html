<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    Content-Security-Policy:
      - script-src 'self'  → only load scripts from the same origin
      - connect-src        → allow XHR/fetch to the local backend only
  -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src http://localhost:8080; img-src 'self' blob: data:; object-src blob:; frame-src blob:"
  />
  <title>Cloud Backup</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1><button id="logo-btn">Cloud Backup</button></h1>
      <button id="theme-toggle-btn" class="header-icon-btn" title="Toggle dark/light mode" aria-label="Toggle dark/light mode">🌙</button>
      <div id="header-user" class="header-user hidden">
        <button id="history-nav-btn" class="header-activity-btn" title="Activity log" aria-label="Activity log">📋 Activity</button>
        <div class="header-avatar-container">
          <button id="header-avatar" class="header-avatar" aria-label="Profile menu" aria-haspopup="true" aria-expanded="false" aria-controls="avatar-dropdown" data-email=""></button>
          <div id="avatar-dropdown" class="avatar-dropdown hidden">
            <button id="avatar-dropdown-account" class="avatar-dropdown-item">👤 Account</button>
            <button id="avatar-dropdown-settings" class="avatar-dropdown-item">⚙️ Settings</button>
            <button id="avatar-dropdown-signout" class="avatar-dropdown-item">Sign Out</button>
          </div>
        </div>
      </div>
    </header>

    <main class="app-main">
      <div id="session-status" class="card loading">
        <p>Connecting to server…</p>
      </div>
      <div id="dashboard" class="hidden"></div>
      <div id="file-browser" class="hidden"></div>
      <div id="history" class="hidden"></div>
      <div id="account" class="hidden"></div>
      <div id="settings" class="hidden"></div>
    </main>
  </div>

  <script src="api-client.js"></script>
  <script src="api.js"></script>
  <script src="ui.js"></script>
  <script src="auth.js"></script>
  <script src="dashboard.js"></script>
  <script src="files.js"></script>
  <script src="account.js"></script>
  <script src="settings.js"></script>
  <script src="history.js"></script>
  <script src="app.js"></script>
</body>
</html>
